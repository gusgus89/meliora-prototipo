function renderMyClasses(){const main=document.getElementById('main'),today=new Date();today.setHours(0,0,0,0);const mondays=professorPublishedMondays();let classes=mondays.flatMap(generateWeek).filter(c=>c.teacher===currentUser.name&&c.dateObj>=today).sort((a,b)=>a.dateObj-b.dateObj||timeMin(a.start)-timeMin(b.start));const todayIso=iso(today),todayCount=classes.filter(c=>c.date===todayIso).length;const days=[...new Set(classes.map(c=>c.date))];const nextDay=days.find(d=>d>todayIso);main.innerHTML=`<div class="page-head"><div><h2>Mis clases</h2><div class="sub">Tus clases de todas las semanas que el administrador tenga publicadas</div></div><span class="pill ${todayCount?'ok':''}">Hoy: ${todayCount} clase${todayCount===1?'':'s'}</span></div><div id="myDays"></div>`;const box=document.getElementById('myDays');if(!classes.length){box.innerHTML='<div class="empty">No tienes clases asignadas en las semanas publicadas que quedan por delante.</div>';return}days.forEach(d=>{const list=classes.filter(c=>c.date===d),open=d===todayIso||d===nextDay;const wrap=document.createElement('section');wrap.className='day-accordion';wrap.innerHTML=`<button class="day-toggle"><span><strong>${fmtLong(parseISO(d))}</strong><div class="sub">${list.length} clase${list.length===1?'':'s'}</div></span><span>${open?'−':'+'}</span></button><div class="day-content ${open?'':'hidden'}">${list.map(c=>`<div class="myclass" data-id="${c.id}"><div><b>${c.start} · ${c.room} · ${c.name}</b><small>${c.focus||''}</small></div><span>Ver</span></div>`).join('')}</div>`;wrap.querySelector('.day-toggle').onclick=()=>{wrap.querySelector('.day-content').classList.toggle('hidden');wrap.querySelector('.day-toggle span:last-child').textContent=wrap.querySelector('.day-content').classList.contains('hidden')?'+':'−'};wrap.querySelectorAll('.myclass').forEach(el=>el.onclick=()=>openClass(list.find(c=>c.id===el.dataset.id)));box.appendChild(wrap)})}

function renderSchedule(){const main=document.getElementById('main');if(currentUser.role!=='admin'&&!isPublished(viewMonday)){const published=professorPublishedMondays();if(!published.length){main.innerHTML=`<div class="page-head"><div><h2>Horario</h2></div></div><div class="empty">No hay semanas publicadas.</div>`;return}viewMonday=published[0]}const classes=generateWeek(viewMonday),published=isPublished(viewMonday);
 main.innerHTML=`<div class="page-head"><div><h2>Horario</h2><div class="sub">CW${isoWeek(viewMonday)} · ${fmtDate(viewMonday)}–${fmtDate(addDays(viewMonday,5))}${currentUser.role==='admin'&&currentRoom!=='GROW'?` · Ciclo ${currentRoom}: Semana ${cycleWeek(viewMonday,currentRoom==='ROOT'?8:3)}`:''}</div></div><div class="week-controls"><button class="iconbtn" id="prevW">Anterior</button><div class="week-label">${fmtDate(viewMonday)} – ${fmtDate(addDays(viewMonday,5))}</div><button class="iconbtn" id="nextW">Siguiente</button></div></div><div class="room-tabs">${['ROOT','GROUND','GROW'].map(r=>`<button data-room="${r}" class="${currentRoom===r?'active':''}">${r}</button>`).join('')}</div><div class="schedule-wrap"><div class="schedule-grid" id="grid"></div></div>`;
 const prev=document.getElementById('prevW'),next=document.getElementById('nextW');
 if(currentUser.role==='admin'){prev.onclick=()=>{viewMonday=addDays(viewMonday,-7);renderSchedule()};next.onclick=()=>{viewMonday=addDays(viewMonday,7);renderSchedule()}}
 else{const p=adjacentPublishedMonday(viewMonday,-1),n=adjacentPublishedMonday(viewMonday,1);prev.disabled=!p;next.disabled=!n;prev.onclick=()=>{if(p){viewMonday=p;renderSchedule()}};next.onclick=()=>{if(n){viewMonday=n;renderSchedule()}}}
 main.querySelectorAll('.room-tabs button').forEach(b=>b.onclick=()=>{currentRoom=b.dataset.room;renderSchedule()});
 const grid=document.getElementById('grid');for(let di=0;di<6;di++){const date=addDays(viewMonday,di),list=classes.filter(c=>c.room===currentRoom&&c.dayIndex===di);const col=document.createElement('div');col.className='daycol';col.innerHTML=`<div class="dayhead"><b>${DAY_NAMES[di]}${SOFT_OPENING_DATES.has(iso(date))?' · SOFT OPENING':(isHoliday(date)?' · FESTIVO':'')}</b><small>${fmtDate(date)}${currentRoom==='ROOT'?` · ${ROOT_FOCUS[di]}`:''}</small></div>`;list.forEach(c=>col.appendChild(slotNode(c)));grid.appendChild(col)}}

function slotNode(c){const div=document.createElement('div');div.className='slot'+(!c.teacher?' unassigned':'');const allowed=currentUser.role==='admin'||c.teacher===currentUser.name;div.innerHTML=`<div class="slot-time">${c.start}–${c.end}</div><div class="slot-name">${c.room==='GROUND'&&!c.name.startsWith('GROUND')?'GROUND · '+c.name:c.name}</div><div class="slot-meta">${c.focus?c.focus+' · ':''}${c.teacher||'Sin asignar'}</div>${c.note?`<div class="pending">${c.note}</div>`:''}`;if(currentUser.role==='admin'){const sel=document.createElement('select');sel.innerHTML=`<option value="">Sin asignar</option>`+TEACHERS.map(t=>{const conflict=findConflict(t,c.date,c.start,c.id);return `<option value="${t}" ${c.teacher===t?'selected':''} ${conflict?'disabled':''}>${t}${conflict?` — ocupado en ${conflict.room}`:''}</option>`}).join('');sel.onclick=e=>e.stopPropagation();sel.onchange=e=>changeTeacher(c,e.target.value||null,e.target);div.appendChild(sel)}div.onclick=()=>{if(allowed)openClass(c)};return div}
function changeTeacher(c,newTeacher,select){if(newTeacher){const conflict=findConflict(newTeacher,c.date,c.start,c.id);if(conflict){alert(`${newTeacher} ya está asignado a ${conflict.room} a las ${conflict.start}.`);select.value=c.teacher||'';return}}assignmentOverrides[classKey(c)]=newTeacher;saveJSON(LS_OVERRIDES,assignmentOverrides);renderSchedule()}

function renderManagement(){const main=document.getElementById('main');main.innerHTML=`<div class="page-head"><div><h2>Gestión de semanas</h2><div class="sub">Publica las semanas visibles para profesores y marca festivos. Un festivo de lunes a viernes usa horario 10:00, 11:00 y 12:00; ROOT mantiene la planificación Morning del día real.</div></div></div><div class="yearbar"><button class="iconbtn" id="prevY">Anterior</button><strong>${manageYear}</strong><button class="iconbtn" id="nextY">Siguiente</button></div><div class="management" id="weekList"></div>`;document.getElementById('prevY').onclick=()=>{manageYear--;renderManagement()};document.getElementById('nextY').onclick=()=>{manageYear++;renderManagement()};const list=document.getElementById('weekList');let d=startOfWeek(new Date(manageYear,0,4));while(d.getFullYear()===manageYear||addDays(d,3).getFullYear()===manageYear){const mon=new Date(d),on=isPublished(mon),wrap=document.createElement('div');wrap.className='week-management';const days=Array.from({length:6},(_,i)=>addDays(mon,i));wrap.innerHTML=`<div class="weekrow"><b>Semana ${isoWeek(mon)}</b><span>${fmtDate(mon)} – ${fmtDate(addDays(mon,6))}</span><button class="switch ${on?'on':'off'}" data-publish>${on?'Publicada':'Oculta'}</button></div><div class="holiday-row"><span class="holiday-label">Festivos</span>${days.map((date,i)=>`<button class="holiday-btn ${isHoliday(date)?'on':''}" data-date="${iso(date)}" ${i===5?'disabled title="El sábado ya utiliza su propio horario"':''}>${DAY_NAMES[i].slice(0,3)} ${date.getDate()}${isHoliday(date)?' · Festivo':''}</button>`).join('')}</div>`;wrap.querySelector('[data-publish]').onclick=()=>{weekVisibility[iso(mon)]=!isPublished(mon);saveJSON(LS_WEEK,weekVisibility);renderManagement()};wrap.querySelectorAll('.holiday-btn:not([disabled])').forEach(btn=>btn.onclick=()=>{toggleHoliday(btn.dataset.date);renderManagement()});list.appendChild(wrap);d=addDays(d,7);if(d.getFullYear()>manageYear&&isoWeek(d)===1)break}}

function phaseDetailHtml(name,real,c){
 if(name==='COOL DOWN')return ''; if(!real)return `<div class="sub">El contenido detallado de esta fase todavía no está cargado.</div>`;
 if(name==='HOW TO')return `<div>${real.protocol||'Sin información adicional.'}</div>`;
 if(name==='WARM UP'&&real.warmup)return warmupGroupsHtml(real.warmup);
 if(name==='STRENGTH'&&real.strength)return `<div class="sub">${real.strength.note||''}</div>${real.strength.stations.map((st,i)=>`<p><b>Estación ${i+1} · ${st.material}</b><br>${st.exercises.map((x,j)=>`${j+1}. ${x}`).join('<br>')}</p>`).join('')}`;
 if(name==='MOVEMENT'&&real.stations)return `<div>${real.protocol||''}</div><p><b>6 estaciones</b></p>${real.stations.map((st,i)=>`<p><b>Estación ${i+1} · ${st.material}</b><br>${st.exercises.map((x,j)=>`${j+1}. ${x}`).join('<br>')}</p>`).join('')}`;
 if(real.finisher&&name===real.finisher.name.split(' · ')[0])return `<div class="sub">${real.finisher.note||''}</div><ul>${real.finisher.exercises.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 if(name==='COOL DOWN')return '';
 if(name==='RETO'||name==='BOOST')return real.finisher?`<div class="sub">${real.finisher.note||''}</div><ul>${real.finisher.exercises.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<div class="sub">El contenido detallado de esta fase todavía no está cargado.</div>`;
 return `<div class="sub">El contenido detallado de esta fase todavía no está cargado.</div>`;
}

const GROUND_WEEK1_RETO=['Plank to blast off','Back Lunge kick','High knees','Squat to toe tap','Lunge jump'];
function groundWeek1For(c){
  if(c.cycleWeek!==1)return null;
  const structure=(c.structure||'').replace(/GROUND\s*(\d)/,'GROUND $1');
  return GROUND_WEEK1_EXERCISES[structure]?.[c.focus]||null;
}
function warmupGroupsHtml(items){
 const groups=[['BREATHE',items.slice(0,1)],['CONNECT',items.slice(1,4)],['MOVE',items.slice(4,7)],['BOOST',items.slice(7)]];
 return groups.filter(([,xs])=>xs.length).map(([title,xs])=>'<p><b>'+title+'</b></p><ul>'+xs.map(x=>'<li>'+x+'</li>').join('')+'</ul>').join('');
}
function groundWarmupHtml(c){
  // ROOT es la autoridad: buscar por semana y foco, nunca por el tipo de clase GROUND.
  const rootByFocus={Upper:'BOOST|Upper',Lower:'MATCH|Lower','Full Body':'DEEP|Full Body'};
  if(c.cycleWeek!==1)return '<div class="sub">Warm up ROOT de esta semana pendiente de cargar.</div>';
  const source=ROOT_WEEK1_CONTENT[rootByFocus[c.focus]];
  if(!source||!Array.isArray(source.warmup))return '<div class="sub">Warm up ROOT pendiente para este foco.</div>';
  return warmupGroupsHtml(source.warmup);
}
function groundPhase(title,time,detail){
 return '<section class="phase"><button class="phase-toggle" type="button"><span class="phase-title">'+title+'</span><span class="phase-time">'+time+'</span><span class="phase-arrow">+</span></button><div class="phase-content hidden">'+detail+'</div></section>';
}
function groundPhasesHtml(c){
 const st=groundWeek1For(c);
 const protocol=st?('<p><b>'+c.structure+' · 24 min</b></p>'+
   '<p><b>'+st.length+' estaciones · '+st.reduce((n,x)=>n+x.length,0)+' ejercicios</b></p>'+
   '<p>'+(c.structure==='GROUND 6'?'4 rondas · 50 segundos de trabajo / 10 segundos de transición. Completar las estaciones en cada ronda.':
   c.structure==='GROUND 4'?'1 ronda · 3 × (40 segundos de trabajo / 20 segundos de transición) por pareja de ejercicios.':
   '4 rondas · 45 segundos de trabajo / 15 segundos de transición por ejercicio. Cada ronda recorre los 2 ejercicios de las 3 estaciones.')+'</p>'+
   (c.structure==='GROUND 6'&&c.focus==='Lower'?'<p>Los ejercicios unilaterales cambian de lado en cada ronda.</p>':'')+
   (c.structure==='GROUND 3'&&c.focus==='Lower'?'<p>En ejercicios unilaterales: alternar el lado en cada una de las 4 rondas (2 rondas por lado).</p>':''))
   :'<div class="sub">Organización del circuito pendiente para esta semana.</div>';
 const howto='<p>Explicar los ejercicios de cada estación, demostrarlos y ofrecer opciones de peso.</p>'+protocol;
 const circuit=st?(protocol+st.map((ex,i)=>'<p><b>Estación '+(i+1)+'</b><br>'+ex.map((v,j)=>(ex.length>1?(j+1)+'. ':'')+v).join('<br>')+'</p>').join('')):'<div class="sub">Contenido de circuito pendiente para esta semana.</div>';
 const reto=c.cycleWeek===1?'<p><b>EMOM · 5 min</b></p><ol>'+GROUND_WEEK1_RETO.map(x=>'<li>'+x+'</li>').join('')+'</ol>':'<div class="sub">Reto semanal pendiente de cargar.</div>';
 return '<div class="phase-list">'+
  groundPhase('WELCOME','2 min','')+
  groundPhase('HOW TO','4 min',howto)+
  groundPhase('WARM UP','8 min',groundWarmupHtml(c))+
  '<div class="prep-row"><span>PREP · 1:30</span></div>'+
  groundPhase('MOVEMENT','24 min',circuit)+
  groundPhase('RETO','5 min',reto)+
  groundPhase('COOL DOWN','4 min','')+
  '</div>';
}

function rootPhasesHtml(c,real){return `<div class="phase-list">${ROOT_STRUCTURES[c.structure].map(([n,t],idx)=>{if(n==='PREP'||n==='REST')return `<div class="prep-row"><span>${n} · ${t}</span></div>`;return `<section class="phase"><button class="phase-toggle" type="button"><span class="phase-title">${n}</span><span class="phase-time">${t}</span><span class="phase-arrow">+</span></button><div class="phase-content hidden">${phaseDetailHtml(n,real,c)}</div></section>`}).join('')}</div>`}
function stationsOutsideHtml(real){if(!real||!real.stations)return '';return `<div class="station-list"><h4>Estaciones · MOVEMENT</h4><div class="sub">La numeración coincide con los botones del plano ROOT.</div>${real.stations.map((st,i)=>`<div class="station-line"><b>Estación ${i+1} · ${st.material}</b><br>${st.exercises.map((x,j)=>`${j+1}. ${x}`).join('<br>')}</div>`).join('')}</div>`}
function bindPhaseAccordions(){document.querySelectorAll('.phase-toggle').forEach(btn=>btn.onclick=()=>{const body=btn.nextElementSibling,open=!body.classList.contains('hidden');body.classList.toggle('hidden',open);btn.querySelector('.phase-arrow').textContent=open?'+':'−'})}
let activeClassModal=null;let stationModalOpen=false;
function openClass(c){activeClassModal=c;stationModalOpen=false;document.getElementById('modalTitle').textContent=`${c.room} · ${c.name}`;document.getElementById('modalSubtitle').textContent=`${fmtLong(c.dateObj)}${c.isSoftOpening?' · SOFT OPENING':(c.isHoliday?' · FESTIVO':'')} · ${c.start}–${c.end} · ${c.teacher||'Sin asignar'}`;let html=`<div class="facts"><span class="pill">${c.focus||c.room}</span>${c.room==='ROOT'?`<span class="pill">${c.band==='morning'?'Mañana':c.band==='midday'?'Mediodía':'Tarde'}</span>`:''}</div>`;if(c.room==='ROOT'){const real=rootContentFor(c);html+=rootPhasesHtml(c,real);if(!real && c.cycleWeek===1){html+=`<div class="note">Contenido de ejercicios pendiente de recibir para ${c.structure} ${c.focus}. No se han añadido ejercicios inventados.</div>`}if(c.dayIndex===5)html+=`<div class="note">Sábado: las tres clases se consideran de mañana. La relación definitiva entre las tres filas del Excel de planificación y los horarios del sábado sigue pendiente de aclarar con el cliente.</div>`;html+=rootFloorHtml(real)}else if(c.room==='GROUND'){html+=groundPhasesHtml(c)}else{html+=`<div class="empty">Sala de autor. El contenido detallado de esta clase todavía no está cargado en el prototipo.</div>${c.note?`<div class="note">${c.note}</div>`:''}`};document.getElementById('modalBody').innerHTML=html;document.getElementById('overlay').classList.remove('hidden');bindPhaseAccordions();document.querySelectorAll('.station').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=Number(b.dataset.i),real=rootContentFor(c);if(real&&real.stations&&real.stations[i])openRootStation(i,real.stations[i]);else openExercise(i)})}

function rootFloorHtml(real){return `<h4 class="floor-title">Plano ROOT · distribución de estaciones</h4><div class="floor-help">${real?'Pulsa una estación para consultar sus ejercicios de esta clase.':'Contenido real de estaciones todavía pendiente para esta combinación.'}</div><div class="floor"><img src="${ROOT_PLAN_IMAGE}" alt="Plano de la sala ROOT">${STATIONS.map((p,i)=>`<button class="station" data-i="${i}" style="left:${p.x}%;top:${p.y}%">${i+1}</button>`).join('')}</div>`}
function openRootStation(i,st){stationModalOpen=true;document.getElementById('modalTitle').textContent=`Estación ${i+1}`;document.getElementById('modalSubtitle').textContent=st.exercises.join(' · ');document.getElementById('modalBody').innerHTML=`<div class="exercise-card"><h4>${st.exercises.length===1?'Ejercicio':'Ejercicios'}</h4>${st.exercises.map((x,j)=>`<p><b>${st.exercises.length>1?(j+1)+'. ':''}${x}</b></p>`).join('')}<dl><dt>Material</dt><dd>${st.material}</dd></dl></div>`}
function openExercise(i){stationModalOpen=true;const e=EXERCISES[i];document.getElementById('modalTitle').textContent=`Estación ${i+1} · ${e.name}`;document.getElementById('modalSubtitle').textContent='Contenido demo para comprobar la funcionalidad';document.getElementById('modalBody').innerHTML=`<div class="exercise-card"><h4>${e.name}</h4><dl><dt>Material</dt><dd>${e.material}</dd><dt>Descripción</dt><dd>${e.desc}</dd><dt>Indicaciones</dt><dd>${e.tips}</dd><dt>Trabajo</dt><dd>45 s (demo)</dd></dl><a class="video-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.name+' ejercicio')}" target="_blank" rel="noopener">Buscar vídeo</a></div><div class="note">Los ejercicios actuales son de demostración. El repositorio real de ejercicios por sala y tipo de clase sigue pendiente de recibir.</div>`}

function attemptLogin(){document.getElementById('loginError').textContent=login(document.getElementById('username').value,document.getElementById('password').value)?'':'Usuario o contraseña incorrectos.'}
document.getElementById('loginBtn').onclick=attemptLogin;
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();attemptLogin()});document.getElementById('logoutBtn').onclick=logout;function closeCurrentModal(){if(stationModalOpen&&activeClassModal){openClass(activeClassModal);return}document.getElementById('overlay').classList.add('hidden');activeClassModal=null;stationModalOpen=false}document.getElementById('closeModal').onclick=closeCurrentModal;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeCurrentModal()};
</script>
</body></html>
